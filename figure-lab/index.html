<p class="eyebrow">图解工作台 · 试行 1.0 · 图 6-2</p><h1>能行权，并不等于已经回本</h1><p class="intro">先从到期的股价差拿到收入，再扣除今天已付的期权费。两个判断，发生在不同的分界。</p>
<figure class="lesson-figure call-lesson" id="call-lesson"><figcaption><span class="fig-title">看涨买方：执行价处换行动，回本价处换盈亏</span><span class="fig-tags"><a class="fig-tag" href="../#u02/detailed/ch06-full-call-profit">净损益与回本股价</a><span class="fig-tag">每份对应一股 · 元/股</span></span></figcaption>
<dl class="givens"><div><dt>你的身份</dt><dd>看涨期权买方</dd></div><div><dt>执行价 X</dt><dd>37 元</dd></div><div><dt>今天支付 C₀</dt><dd><span data-fee>3.8</span> 元</dd></div><div><dt>此刻在看</dt><dd>到期时的结果</dd></div></dl>
<p class="condition">本例忽略税费和资金时间价值。费用今天已支付，到期是否行权都不会退回；这里的净损益按教材的未折现口径计算。</p>
<p class="fig-hint"><b>读图</b>先看实线在①处转折，再看虚线在②处穿过零。橙色浅底是“有执行收入，但还未覆盖费用”的区间。</p>
<div class="scenarios" role="group" aria-label="比较四种到期情景"><button type="button" data-scenario="no">不行权 <span>35 元</span></button><button type="button" data-scenario="loss">行权仍亏 <span>39 元</span></button><button type="button" data-scenario="even">恰好回本 <span data-even>40.8 元</span></button><button type="button" data-scenario="gain">开始盈利 <span>45 元</span></button></div>
<section class="derivation" aria-labelledby="derive-title"><h2 id="derive-title">把这一步看清楚</h2><div class="step-buttons" role="group" aria-label="推导步骤"><button data-step="0" aria-pressed="false">1 · 先看行权</button><button data-step="1" aria-pressed="false">2 · 再扣费用</button><button data-step="2" aria-pressed="true">3 · 找到回本</button></div><p id="step-explanation">回本时，Sₜ − 37 = 3.8，所以Sₜ = 40.8。37决定是否行权，40.8决定是否赚回成本。</p></section>
<div class="study-grid"><div class="visual-column"><div class="plot-toolbar"><span id="plot-range">分界附近 · 25–55 元</span><button type="button" id="zoom">看完整范围</button></div><div class="playback"><button id="play" type="button">演示扣除期权费</button><button id="pause" type="button" disabled>暂停</button><button id="finish" type="button" disabled>直接看结果</button><span id="motion-status" role="status">由你启动，播放一次；可暂停、重播。</span></div><p class="plot-unit">纵轴：每股金额（元）</p><div id="call-plot" class="call-plot" aria-label="看涨期权收入和损益曲线"><p>到期净收入=max(Sₜ−37,0)；净损益=到期净收入−3.8。下方情景表列出关键数值。</p></div>
<div class="price-control"><label for="stock">到期股价 Sₜ</label><input id="stock" type="range" min="0" max="70" step="0.1" value="39"><input id="stock-number" type="number" min="0" max="70" step="any" value="39" aria-label="输入到期股价，0到70元"><span>元</span></div><p id="input-error" class="input-error" role="status"></p>
<ol class="fig-points"><li><span class="fig-badge">1</span><span><b>执行价 37 元。</b>高于它，行权才有正的执行净收入。</span></li><li><span class="fig-badge">2</span><span><b>回本价 <span data-even-number>40.8</span> 元。</b>净收入先补足 <span data-fee>3.8</span> 元费用，整笔才不亏。</span></li></ol></div>
<aside class="calculation" aria-label="当前股价的计算"><p class="current-label">当前情景 · Sₜ = <span id="current-stock">39</span> 元</p><dl class="readout"><div><dt>到期净收入</dt><dd class="income"><span id="payoff">2</span><small> 元</small></dd></div><div><dt>减去已付费用</dt><dd><span data-fee>3.8</span><small> 元</small></dd></div><div><dt>整笔净损益</dt><dd class="profit"><span id="profit">−1.8</span><small> 元</small></dd></div></dl><p id="substitution">max(39 − 37, 0) − 3.8 = −1.8</p><p id="explanation" class="explanation" aria-live="polite">行权得到2元，但还没有赚回3.8元费用，因此整笔亏1.8元。</p><p class="invariant">改变期权费，收入实线与执行价不变；改变的是净损益虚线与回本价。</p></aside></div>

<details class="advanced"><summary>改变条件：期权费</summary><p>先预测：费用上升后，哪条线会改变？执行价会移动吗？</p><div class="fee-control"><label for="fee">期权费 C₀</label><input id="fee" type="range" min="0" max="12" step="0.05" value="3.8"><input id="fee-number" type="number" min="0" max="12" step="any" value="3.8" aria-label="输入期权费，0到12元"><span>元</span></div><p>试试0元和12元；费用为0时，行权与回本分界重合，收入线与损益线也重合。</p></details>
<button id="reset" type="button" class="reset">还原本例</button><p class="figure-note">来源：本章精讲“看涨多头的净损益与回本股价”的教学算例。局部视图只放大分界附近，不改变金额或尺度关系；查看完整范围可观察其余演示区间。看涨买方的最大损失为期权费，上行收益理论上不封顶；70元只是本图输入范围。</p>
<details class="equivalent"><summary>不看图也能核对：关键情景表</summary><div class="table-scroll"><table><thead><tr><th>到期股价</th><th>执行净收入</th><th>净损益</th><th>解释</th></tr></thead><tbody id="scenario-table"><tr><td>35</td><td>0</td><td>−3.8</td><td>不行权，损失费用</td></tr><tr><td>39</td><td>2</td><td>−1.8</td><td>行权仍未覆盖费用</td></tr><tr><td>40.8</td><td>3.8</td><td>0</td><td>恰好回本</td></tr><tr><td>45</td><td>8</td><td>4.2</td><td>开始盈利</td></tr></tbody></table></div></details>
</figure>
<section class="transfer"><h2>换一组数字，检查是否理解</h2><p>执行价50元，期权费4元，到期股价52元。应怎样判断？</p><form id="transfer-form"><label><input type="radio" name="answer" value="a" required> 行权，净损益2元，回本价50元</label><label><input type="radio" name="answer" value="b"> 行权，净损益−2元，回本价54元</label><label><input type="radio" name="answer" value="c"> 因为整笔亏损，所以不行权</label><button type="submit">核对推理</button></form><p id="transfer-feedback" role="status"></p></section>
